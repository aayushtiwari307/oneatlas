name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time placeholders only. The job deliberately has no database service
      # and must not execute a Prisma query during static/build evaluation.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/oneatlas?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/oneatlas?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build without a database
        run: npm run build
